name: Preflight

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: npm ci
      - run: deno check --node-modules-dir=auto supabase/functions/request-email-code/index.ts supabase/functions/verify-email-code/index.ts supabase/functions/sync-vault/index.ts supabase/functions/get-vault-copy/index.ts supabase/functions/clear-vault-copy/index.ts supabase/functions/mindpulse-api/index.ts supabase/functions/resource-admin/index.ts supabase/functions/revoke-device/index.ts
      - run: deno test --node-modules-dir=auto --allow-env supabase/functions/revoke-device/handler.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-regression-evidence
          path: |
            output/playwright
            output/regression-artifacts
          if-no-files-found: ignore
