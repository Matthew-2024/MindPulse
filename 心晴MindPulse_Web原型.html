<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="assets/mindpulse-icon.svg">
<meta name="description" content="心晴 MindPulse Web 原型包。保留入口 HTML、src 脚本与资源后运行。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="心晴">
<meta name="theme-color" content="#eef6f2">
<link rel="manifest" href="manifest.webmanifest">
<title>心晴 MindPulse Web 原型包</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef6f2;
  --bg-2:#fffaf3;
  --card:#fffefa;
  --text:#233531;
  --muted:#6f7f78;
  --line:#dbe7df;
  --brand:#79bfae;
  --brand-2:#a9cf9d;
  --mint:#8bcdbc;
  --blue:#8fb8d8;
  --lav:#c9c1ea;
  --danger:#d96f68;
  --shadow:0 12px 30px rgba(96,126,116,.11);
  --top:env(safe-area-inset-top,20px);
  --bottom:env(safe-area-inset-bottom,0px);
}
*,*:before,*:after{box-sizing:border-box}
html,body{min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;background:
radial-gradient(circle at top left,rgba(255,230,190,.34),transparent 28%),
radial-gradient(circle at top right,rgba(139,205,188,.22),transparent 26%),
linear-gradient(180deg,var(--bg-2),var(--bg));color:var(--text);overflow-x:hidden}
body{padding:0 0 calc(86px + var(--bottom))}
body.home-screen{padding-bottom:calc(86px + var(--bottom));background:#edf6f2;overflow-x:hidden;overflow-y:auto}
a{text-decoration:none}
button,input,textarea{font:inherit}
button{border:none;background:none;cursor:pointer}
textarea{resize:none}
#app{width:min(100%,393px);max-width:393px;min-height:100vh;min-height:100dvh;margin:0 auto;position:relative;--page-shift:0px}
body.home-screen #app{min-height:100vh;min-height:100dvh;overflow:visible}
#app[data-dir="forward"]{--page-shift:22px}
#app[data-dir="back"]{--page-shift:-22px}
#app[data-dir="soft"]{--page-shift:0px}
.page{padding-bottom:28px;will-change:transform,opacity,filter}
#app[data-dir="forward"] .page,#app[data-dir="back"] .page{animation:pageEnter .36s cubic-bezier(.16,1,.3,1) both}
body.home-screen .page{min-height:100vh;overflow:visible;padding-bottom:0;animation:none;filter:none}
.page-body{display:flex;flex-direction:column;gap:12px;padding:14px 0 10px}
.home-immersive{--home-nav:calc(74px + var(--top));display:flex;flex-direction:column;background:
radial-gradient(circle at 12% 0%,rgba(255,227,190,.55),transparent 30%),
radial-gradient(circle at 88% 10%,rgba(156,207,193,.42),transparent 34%),
linear-gradient(180deg,#f8fbf7 0%,#edf6f2 54%,#e7f0f4 100%)}
.home-immersive .page-body{flex:0 0 auto;min-height:calc(100vh - var(--home-nav));height:auto;padding:0}
#app[data-dir="forward"] .page-body>*,#app[data-dir="back"] .page-body>*{animation:sectionEnter .42s cubic-bezier(.16,1,.3,1) both}
.page-body>*:nth-child(1){animation-delay:.03s}
.page-body>*:nth-child(2){animation-delay:.07s}
.page-body>*:nth-child(3){animation-delay:.11s}
.page-body>*:nth-child(4){animation-delay:.15s}
.page-body>*:nth-child(n+5){animation-delay:.18s}
.nb{position:sticky;top:0;z-index:20;padding:calc(8px + var(--top)) 18px 12px;background:rgba(246,241,235,.84);backdrop-filter:blur(18px);border-bottom:1px solid rgba(234,223,212,.7)}
.home-immersive .nb{position:relative;flex:0 0 var(--home-nav);height:var(--home-nav);background:transparent;border-bottom:none;color:#27413b;z-index:24;padding:calc(14px + var(--top)) 20px 8px}
.home-immersive .nb-sub{color:#71867f}
.nb h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.nb-sub{font-size:12px;color:#526a63;margin-top:4px}
.nb-row{display:flex;align-items:center;gap:12px}
.nb-back{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(32,26,23,.06);flex-shrink:0}
.shell{padding:0 16px}
.section-title{padding:8px 18px 0;font-size:14px;font-weight:700;color:var(--text)}
.section-sub{padding:4px 18px 0;font-size:12px;color:var(--muted);line-height:1.6}
.card{margin:0 16px;background:var(--card);border:1px solid rgba(234,223,212,.9);border-radius:24px;box-shadow:var(--shadow)}
.hero{margin:0 16px;padding:22px 18px 18px;border-radius:30px;background:
radial-gradient(circle at top right,rgba(255,255,255,.42),transparent 28%),
linear-gradient(145deg,#ff8a71 0%,#f8a06d 44%,#9fd3c6 100%);
color:#fff;box-shadow:0 18px 40px rgba(246,130,93,.26);position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.12)}
.hero:before{width:180px;height:180px;right:-70px;top:-70px}
.hero:after{width:120px;height:120px;left:-36px;bottom:-52px}
.hero-top,.hero-bottom{position:relative;z-index:1}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
.hero h2{margin-top:14px;font-size:31px;line-height:1.25;font-weight:800;letter-spacing:.2px}
.hero p{margin-top:10px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.92)}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-pill{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:600}
.hero-actions{display:flex;gap:10px;margin-top:18px}
.btn,.btn-lite,.btn-ghost{width:100%;min-height:44px;border-radius:16px;padding:13px 16px;font-size:14px;font-weight:700;transition:transform .18s ease,box-shadow .18s ease}
.btn{background:linear-gradient(135deg,#6eb6a6,#a7c88e);color:#fff;box-shadow:0 8px 20px rgba(96,166,150,.22)}
.btn-lite{background:rgba(255,255,255,.62);color:#38544d;border:1px solid rgba(116,151,141,.22);backdrop-filter:blur(8px)}
.btn-ghost{background:#fff4ea;color:#c9634f}
.btn:active,.btn-lite:active,.btn-ghost:active{transform:scale(.98)}
.btn:disabled,.btn-lite:disabled,.btn-ghost:disabled{opacity:.48;box-shadow:none;cursor:not-allowed;transform:none}
.pulse-stage{margin:0 16px;padding:18px;border-radius:28px;background:linear-gradient(180deg,#f8fbf7,#edf6f2);color:#253f39;box-shadow:0 18px 40px rgba(94,130,119,.14);overflow:hidden;position:relative;border:1px solid rgba(117,151,141,.18)}
.pulse-stage:before{content:"";position:absolute;inset:auto -20px -70px -20px;height:150px;background:linear-gradient(90deg,rgba(166,201,143,.26),rgba(123,201,183,.28),rgba(143,184,216,.22));filter:blur(18px)}
.pulse-content{position:relative;z-index:1}
.pulse-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.pulse-kicker{font-size:12px;color:#69968a;font-weight:700}
.pulse-title{margin-top:6px;font-size:24px;line-height:1.28;font-weight:800}
.pulse-score{min-width:76px;text-align:right}
.pulse-score-num{font-size:34px;font-weight:800;line-height:1}
.pulse-score-label{margin-top:6px;font-size:11px;color:#71867f}
.pulse-wave{height:88px;display:flex;align-items:center;gap:6px;margin-top:18px}
.pulse-bar{flex:1;border-radius:999px;background:linear-gradient(180deg,#fff,#a6c98f);opacity:.95;animation:pulseLift 3.4s ease-in-out infinite}
.pulse-bar:nth-child(2n){background:linear-gradient(180deg,#fff,#7bc9b7)}
.pulse-bar:nth-child(3n){background:linear-gradient(180deg,#fff,#7fa9ff)}
.pulse-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pulse-mini{padding:10px;border-radius:14px;background:rgba(255,255,255,.68);border:1px solid rgba(117,151,141,.18)}
.pulse-mini-label{font-size:11px;color:#71867f}
.pulse-mini-value{margin-top:5px;font-size:15px;font-weight:800}
.pulse-insight{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.66);font-size:13px;line-height:1.65;color:#526a63;border:1px solid rgba(117,151,141,.14)}
.signal-hero{margin:0 16px;padding:20px;border-radius:30px;background:
radial-gradient(circle at 12% 0%,rgba(255,230,190,.72),transparent 28%),
radial-gradient(circle at 90% 8%,rgba(147,205,190,.5),transparent 30%),
linear-gradient(180deg,#f8fbf7 0%,#edf6f2 62%,#e7f0f4 100%);color:#253f39;box-shadow:0 22px 48px rgba(94,130,119,.15);overflow:hidden;position:relative}
.home-immersive .signal-hero{margin:0;min-height:calc(100vh - var(--home-nav));border-radius:0;padding:12px 20px calc(116px + var(--bottom));display:flex;align-items:stretch;box-shadow:none;background:
radial-gradient(circle at 12% 0%,rgba(255,230,190,.72),transparent 28%),
radial-gradient(circle at 90% 8%,rgba(147,205,190,.5),transparent 30%),
linear-gradient(180deg,#f8fbf7 0%,#edf6f2 62%,#e7f0f4 100%)}
.signal-hero:before{content:"";position:absolute;inset:0;background:
linear-gradient(rgba(92,125,116,.07) 1px,transparent 1px),
linear-gradient(90deg,rgba(92,125,116,.07) 1px,transparent 1px);
background-size:34px 34px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 72%);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 72%);opacity:.58}
body.home-screen .signal-hero:before{display:none}
body.home-screen .signal-hero:after{display:none}
body.home-screen .page-body>*{animation:none}
body.home-screen .wave-line{animation:none}
.signal-hero:after{content:"";position:absolute;left:0;right:0;bottom:-58px;height:150px;background:linear-gradient(90deg,rgba(255,202,164,.28),rgba(143,184,216,.16),rgba(139,205,188,.24));opacity:.55}
.radar-tags{position:absolute;inset:150px 0 auto;height:190px;z-index:1;pointer-events:none;opacity:.34}
.radar-tags:before{content:"";position:absolute;left:50%;top:48%;width:190px;height:190px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 42px rgba(255,255,255,.02),0 0 38px rgba(123,201,183,.17);animation:radarPulse 2.6s ease-in-out infinite}
.radar-tags:after{content:"";position:absolute;left:50%;top:48%;width:132px;height:2px;transform-origin:left center;background:linear-gradient(90deg,rgba(123,201,183,.04),rgba(123,201,183,.72),transparent);animation:radarSweep 4.2s linear infinite}
.radar-tag{display:none}
.signal-content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;justify-content:space-between;min-height:0;opacity:1;visibility:visible}
.home-immersive .signal-content{min-height:100%;gap:14px;justify-content:center}
.home-front .signal-content{gap:22px}
.home-back .signal-content{gap:18px;justify-content:center}
.signal-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.signal-brand{font-size:12px;font-weight:800;color:#69968a}
.signal-title{margin-top:8px;font-size:32px;line-height:1.14;font-weight:900;max-width:250px}
.home-immersive .signal-title{font-size:31px;max-width:235px;letter-spacing:-.6px}
.signal-score{text-align:right;min-width:72px}
.signal-score strong{display:block;font-size:36px;line-height:1;font-weight:900}
.signal-score span{display:block;margin-top:6px;font-size:11px;color:#71867f}
.signal-score em{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:999px;background:rgba(255,229,180,.72);border:1px solid rgba(213,176,103,.28);font-style:normal;font-size:11px;font-weight:850;color:#8a6a2c}
.score-forecast{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:16px;background:#342f37;border:1px solid rgba(255,255,255,.14);font-size:12px;color:#f7f3ef}
.privacy-note{margin-top:9px;font-size:11px;line-height:1.5;color:rgba(255,255,255,.56)}
.signal-wave{height:72px;margin:10px -6px 0}
.signal-wave svg{width:100%;height:100%;display:block}
.wave-line{fill:none;stroke:url(#pulseGradient);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:620;filter:drop-shadow(0 2px 2px rgba(45,100,88,.14));animation:waveDraw 4.2s ease-in-out infinite}
.wave-shadow{fill:none;stroke:rgba(77,116,106,.22);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.hero-evidence-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.hero-evidence{padding:8px 9px;border-radius:14px;background:rgba(255,255,255,.68);border:1px solid rgba(117,151,141,.18);box-shadow:0 8px 22px rgba(94,130,119,.08)}
.hero-evidence-label{font-size:10px;color:#7b8f88}
.hero-evidence-value{margin-top:4px;font-size:13px;font-weight:900;color:#28433c}
.hero-evidence-value b{color:#bf7a58}
.agent-observe{margin-top:9px;padding:10px 11px;border-radius:17px;background:#332e38;border:1px solid rgba(255,255,255,.16)}
.agent-observe-label{font-size:12px;font-weight:800;color:#6ea999}
.agent-observe-text{margin-top:6px;font-size:13px;line-height:1.65;color:rgba(255,255,255,.94)}
.explain-card{margin-top:2px;padding:12px;border-radius:17px;background:rgba(255,255,255,.72);border:1px solid rgba(117,151,141,.2);box-shadow:0 10px 26px rgba(94,130,119,.1)}
.home-back .explain-card{margin-top:0;padding:16px;border-radius:20px}
.explain-title{font-size:12px;font-weight:850;color:#5f9b8d}
.explain-copy{margin-top:6px;font-size:12px;line-height:1.65;color:#526a63}
.risk-pill{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:999px;background:rgba(124,190,174,.18);border:1px solid rgba(84,150,135,.26);font-size:11px;font-weight:850;color:#3f8273}
.agent-verdict{margin-top:10px;font-size:19px;line-height:1.32;font-weight:900;color:#253f39;letter-spacing:0}
.signal-actions{display:flex;gap:10px;margin-top:13px}
.home-front .signal-actions,.home-back .signal-actions{margin-top:2px}
.signal-actions .btn{box-shadow:none}
.signal-actions .btn-lite{background:rgba(255,255,255,.66)}
.agent-command{margin:0 16px;padding:18px;border-radius:26px;background:#fffdf9;border:1px solid #eadfd4;box-shadow:var(--shadow)}
.agent-command.scan-mode{background:linear-gradient(180deg,#f8fbf7,#edf6f2);color:#253f39;border-color:rgba(117,151,141,.18);box-shadow:0 20px 44px rgba(94,130,119,.14);overflow:hidden;position:relative}
.agent-command.scan-mode:before{content:"";position:absolute;inset:-80px -40px auto;height:160px;background:radial-gradient(circle,rgba(123,201,183,.24),transparent 62%);filter:blur(10px)}
.agent-command.scan-mode .agent-command-top,.agent-command.scan-mode .agent-evidence,.agent-command.scan-mode .stage-actions{position:relative;z-index:1}
.agent-command.scan-mode .agent-command-icon{background:linear-gradient(135deg,#72b8a8,#a6c98f);box-shadow:0 0 28px rgba(123,201,183,.26)}
.agent-command.scan-mode .agent-command-copy{color:#5d716b}
.agent-command.scan-mode .agent-evidence-item{background:rgba(255,255,255,.68);border-color:rgba(117,151,141,.18)}
.agent-command.scan-mode .agent-evidence-label{color:#71867f}
.agent-command.scan-mode .agent-evidence-value{color:#253f39}
.home-tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 16px}
.home-tool{min-height:82px;padding:14px;border-radius:20px;background:rgba(255,254,250,.9);border:1px solid rgba(117,151,141,.18);box-shadow:0 10px 26px rgba(94,130,119,.08);text-align:left;color:var(--text)}
.home-tool-icon{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#eefaf6;font-size:17px}
.ui-icon{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home-tool-title{margin-top:10px;font-size:14px;font-weight:850}
.home-tool-meta{margin-top:4px;font-size:11px;line-height:1.45;color:var(--muted)}
.decision-signal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.decision-signal{padding:10px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(117,151,141,.18)}
.decision-signal-label{font-size:12px;color:#526a63}
.decision-signal-value{margin-top:4px;font-size:13px;font-weight:850}
.decision-signal-delta{margin-top:3px;font-size:12px;line-height:1.4;color:#785241}
.memo-search{margin:0 16px;position:relative}
.memo-search .field{padding-left:42px;background:rgba(255,255,255,.92);border-radius:20px}
.memo-search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);pointer-events:none}
.memo-list{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.memo-card{width:100%;padding:16px;border-radius:20px;background:var(--card);border:1px solid rgba(234,223,212,.9);box-shadow:var(--shadow);text-align:left;color:var(--text)}
.memo-card-title{font-size:16px;font-weight:850;line-height:1.35}
.memo-card-meta{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-card-match{margin-top:7px;font-size:10px;color:#4f8f80;font-weight:750}
.memo-create{position:fixed;right:max(20px,calc((100vw - 393px)/2 + 20px));bottom:calc(96px + var(--bottom));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#6eb6a6,#a7c88e);color:#fff;font-size:30px;line-height:1;box-shadow:0 12px 26px rgba(96,166,150,.3);z-index:25}
.memo-title-input{width:100%;border:0;background:transparent;font-size:27px;line-height:1.25;font-weight:900;color:var(--text);outline:none}
.memo-meta{margin-top:8px;font-size:12px;color:var(--muted)}
.memo-editor{margin:0 16px;padding:16px;border-radius:22px;background:var(--card);border:1px solid rgba(234,223,212,.9);box-shadow:var(--shadow)}
.memo-item{display:grid;grid-template-columns:28px minmax(0,1fr) 72px;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid rgba(219,231,223,.74)}
.memo-item:last-child{border-bottom:0}
.memo-number{width:26px;height:26px;border-radius:9px;background:#eefaf6;color:#4f8f80;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:850}
.memo-item-input{width:100%;min-height:44px;border:0;background:transparent;outline:none;padding:3px 0;font-size:15px;line-height:1.7;color:var(--text);resize:none}
.memo-item-actions{display:grid;grid-template-columns:repeat(2,32px);gap:5px;justify-content:end}
.memo-icon-btn{width:32px;height:32px;border-radius:10px;background:#f4f7f5;color:#61766f;font-size:15px;display:flex;align-items:center;justify-content:center}
.memo-empty,.schedule-empty{margin:0 16px;padding:22px;border-radius:20px;background:rgba(255,255,255,.62);border:1px dashed rgba(117,151,141,.3);text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.segment-control{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 16px;padding:4px;border-radius:16px;background:rgba(64,83,77,.08)}
.segment-control button{min-height:40px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:750}
.segment-control button.active{background:#fff;color:#397b6c;box-shadow:0 5px 14px rgba(94,130,119,.12)}
.schedule-form{margin:0 16px;padding:15px;border-radius:20px;background:var(--card);border:1px solid rgba(234,223,212,.9);box-shadow:var(--shadow)}
.schedule-form-row{display:grid;grid-template-columns:minmax(0,1fr) 126px;gap:8px;margin-top:8px}
.schedule-form .field{min-height:44px}
.week-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:0 16px}
.calendar-day{min-width:0;min-height:82px;padding:8px 4px;border-radius:15px;background:rgba(255,255,255,.72);border:1px solid rgba(117,151,141,.16);text-align:center;color:var(--text)}
.calendar-day.today{border-color:#70b7a6;background:#eefaf6}
.calendar-day-label{font-size:10px;color:var(--muted)}
.calendar-day-number{margin-top:4px;font-size:15px;font-weight:850}
.calendar-day-count{margin:7px auto 0;width:22px;height:22px;border-radius:8px;background:#fff0e7;color:#b56a4e;font-size:11px;display:flex;align-items:center;justify-content:center}
.schedule-range{display:flex;gap:6px;margin:0 16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.schedule-range::-webkit-scrollbar{display:none}
.schedule-range button{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid rgba(117,151,141,.18);font-size:12px;font-weight:750;color:var(--muted)}
.schedule-range button.active{background:#eefaf6;color:#397b6c;border-color:#8bcdbc}

.rescue-route{margin:0 16px;padding:18px;border-radius:28px;background:linear-gradient(180deg,#f8fbf7,#edf6f2);color:#253f39;box-shadow:0 20px 42px rgba(94,130,119,.14);border:1px solid rgba(117,151,141,.18)}

.closed-loop{margin:0 16px;padding:14px 16px;border-radius:20px;background:#eefaf6;border:1px solid #d4ede5;color:#22584e;display:flex;align-items:flex-start;gap:12px}

.agent-stage{margin:0 16px;padding:18px;border-radius:24px;background:linear-gradient(180deg,#fff8f2,#fffdf9);border:1px solid #f1d9ca;box-shadow:var(--shadow)}
.agent-stage-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.agent-stage-tag{font-size:12px;font-weight:700;color:#b86a52}
.agent-stage-title{margin-top:6px;font-size:20px;line-height:1.35;font-weight:800}
.agent-stage-desc{margin-top:8px;font-size:13px;line-height:1.7;color:var(--muted)}
.agent-avatar{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#ffd3b6,#ffeecf);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
.chip{padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.agent-bubble{margin-top:14px;padding:14px 16px;border-radius:18px;background:#fff;border:1px solid rgba(234,223,212,.95)}
.agent-bubble-label{font-size:12px;color:var(--muted);font-weight:600}
.agent-bubble-text{margin-top:6px;font-size:14px;line-height:1.7}
.stage-actions{display:flex;gap:10px;margin-top:14px}
.path-card{padding:18px;border-radius:24px;background:var(--card);border:1px solid rgba(234,223,212,.92);box-shadow:var(--shadow);margin:0 16px}
.path-label{font-size:13px;font-weight:700;color:#b86a52}
.path-title{margin-top:6px;font-size:21px;line-height:1.35;font-weight:800}
.path-desc{margin-top:8px;font-size:13px;line-height:1.7;color:var(--muted)}
.path-steps{display:flex;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
.path-step{min-width:132px;padding:14px;border-radius:20px;background:#fffaf6;border:1px solid #f1e0d4}
.path-step-top{display:flex;align-items:center;justify-content:space-between}
.path-step-order{width:24px;height:24px;border-radius:50%;background:#ffefe2;color:#d06c4a;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.path-step-icon{font-size:22px}
.path-step-title{margin-top:10px;font-size:15px;font-weight:700}
.path-step-copy{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.6}
.stack{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.action-row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:1px solid rgba(234,223,212,.92);box-shadow:var(--shadow)}
.action-icon{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.action-copy{flex:1}
.action-title{font-size:15px;font-weight:700}
.action-desc{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.6}
.action-arrow{font-size:18px;color:#bdaea2}
.insight-card{margin:0 16px;padding:18px;border-radius:26px;background:linear-gradient(180deg,#fff6ef,#fffdf9);border:1px solid #f1d9ca;box-shadow:var(--shadow)}
.insight-kicker{font-size:12px;font-weight:700;color:#b86a52}
.insight-title{margin-top:8px;font-size:24px;line-height:1.35;font-weight:800}
.insight-desc{margin-top:10px;font-size:13px;line-height:1.8;color:var(--muted)}
.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 16px}
.evidence-card{padding:16px;border-radius:22px;background:var(--card);border:1px solid rgba(234,223,212,.92);box-shadow:var(--shadow)}
.evidence-label{font-size:12px;color:var(--muted)}
.evidence-value{margin-top:8px;font-size:26px;font-weight:800}
.evidence-text{margin-top:6px;font-size:12px;line-height:1.6;color:var(--muted)}
.flow-card{margin:0 16px;padding:18px;border-radius:24px;background:var(--card);border:1px solid rgba(234,223,212,.92);box-shadow:var(--shadow)}
.flow-row{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:14px}
.flow-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
.flow-bar{width:100%;border-radius:12px 12px 8px 8px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;color:#fff;font-size:16px}
.flow-day{font-size:10px;color:var(--muted)}
.report-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:0 16px}
.report-card{padding:17px;border-radius:24px;background:linear-gradient(180deg,#fffdf9,#f4faf6);border:1px solid rgba(164,192,182,.34);box-shadow:0 14px 28px rgba(94,130,119,.1)}
.report-card.alt{background:linear-gradient(180deg,#fff8f2,#fffdf9);border-color:#f1d9ca}
.report-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.report-kicker{font-size:12px;font-weight:850;color:#5f9b8d}
.report-title{margin-top:6px;font-size:20px;line-height:1.35;font-weight:950;color:#253f39}
.report-copy{margin-top:8px;font-size:13px;line-height:1.7;color:#526a63}
.report-stat{min-width:62px;text-align:center;padding:9px;border-radius:17px;background:#eefaf6;border:1px solid #d4ede5;color:#275f55}
.report-stat strong{display:block;font-size:24px;line-height:1;font-weight:950}
.report-stat span{display:block;margin-top:5px;font-size:10px;color:#6f837c}
.timeline-list{display:grid;gap:8px;margin-top:12px}
.timeline-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.timeline-mark{width:34px;height:34px;border-radius:13px;background:#eefaf6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.timeline-main{flex:1;min-width:0}
.timeline-meta{font-size:11px;font-weight:850;color:#5f9b8d}
.timeline-text{margin-top:4px;font-size:13px;line-height:1.55;color:#526a63;word-break:break-word}
.timeline-risk{margin-top:6px;display:inline-flex;padding:4px 7px;border-radius:999px;background:#f7f3ef;color:#7b6b63;font-size:10px;font-weight:850}
.timeline-risk.high{background:#fff0f0;color:#a74842}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week-dot{min-height:62px;padding:8px 5px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center}
.week-dot.active{border-color:#8bcdbc;background:#eefaf6}
.week-day{font-size:10px;color:var(--muted)}
.week-count{margin-top:5px;font-size:16px;font-weight:950;color:#253f39}
.week-risk{margin-top:3px;font-size:10px;color:#b86a52}
.quote-card{margin:0 16px;padding:18px;border-radius:24px;background:linear-gradient(180deg,#f8fbf7,#edf6f2);color:#253f39;box-shadow:0 16px 34px rgba(94,130,119,.14);border:1px solid rgba(117,151,141,.18)}
.quote-card-title{font-size:13px;opacity:.65}
.quote-card-main{margin-top:8px;font-size:22px;line-height:1.45;font-weight:700}
.quote-card-sub{margin-top:10px;font-size:13px;line-height:1.8;opacity:.82}
.danger-card{margin:0 16px;padding:18px;border-radius:24px;background:linear-gradient(135deg,#cf746c,#e5a08e);color:#fff;box-shadow:0 18px 34px rgba(189,105,96,.18)}
.danger-title{font-size:22px;line-height:1.35;font-weight:800}
.danger-copy{margin-top:10px;font-size:13px;line-height:1.8;color:rgba(255,255,255,.92)}
.danger-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.danger-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.danger-step{padding:10px;border-radius:15px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-size:11px;line-height:1.5;font-weight:800;color:#fff}
.hotline-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:linear-gradient(180deg,#fffdf9,#f6fbf8);border:1px solid rgba(164,192,182,.34);box-shadow:0 14px 28px rgba(94,130,119,.12);margin:0 16px;color:inherit;text-decoration:none}
.hotline-badge{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#e8f5f0,#fbefe5);color:#4f9686;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.hotline-copy{flex:1}
.hotline-name{font-size:15px;font-weight:800;color:#27413b}
.hotline-desc{margin-top:4px;font-size:12px;color:var(--muted)}
.hotline-phone{font-size:15px;font-weight:800;color:#5a877d;letter-spacing:.2px}
.boundary{margin:0 16px;padding:16px 18px;border-radius:20px;background:#fffaf6;border:1px solid var(--line);font-size:12px;line-height:1.8;color:var(--muted)}
.setting-card{margin:0 16px;padding:8px 0;border-radius:24px;background:var(--card);border:1px solid rgba(234,223,212,.92);box-shadow:var(--shadow)}
.setting-group-title{padding:10px 18px 4px;font-size:12px;font-weight:700;color:#b86a52;letter-spacing:.2px}
.setting-row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;text-align:left;color:inherit}
.setting-row+.setting-row{border-top:1px solid rgba(234,223,212,.7)}
.setting-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.setting-copy{flex:1}
.setting-title{font-size:15px;font-weight:700}
.setting-desc{margin-top:4px;font-size:12px;color:#667a73;line-height:1.6}
.login-page{min-height:100vh;padding:calc(28px + var(--top)) 18px calc(34px + var(--bottom));background:
radial-gradient(circle at 18% 4%,rgba(255,230,190,.58),transparent 26%),
radial-gradient(circle at 85% 22%,rgba(139,205,188,.34),transparent 30%),
linear-gradient(180deg,#f8fbf7 0%,#edf6f2 62%,#fffaf3 100%)}
.login-brand{font-size:13px;font-weight:900;color:#5f9b8d}
.login-title{margin-top:10px;font-size:31px;line-height:1.18;font-weight:950;color:#253f39}
.login-copy{margin-top:10px;font-size:14px;line-height:1.75;color:#526a63}
.login-card{margin-top:18px;padding:16px;border-radius:24px;background:#fffdf9;border:1px solid rgba(164,192,182,.34);box-shadow:var(--shadow)}
.login-profile-list{display:grid;gap:10px;margin-top:12px}
.login-profile{width:100%;display:flex;align-items:center;gap:12px;padding:13px;border-radius:17px;background:#fff;border:1px solid var(--line);text-align:left;color:inherit}
.login-profile.active{border-color:#8bcdbc;background:#eefaf6}
.login-avatar{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,#72b8a8,#a6c98f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950;flex-shrink:0}
.login-profile-main{flex:1;min-width:0}
.login-profile-name{font-size:15px;font-weight:850}
.login-profile-desc{margin-top:3px;font-size:12px;color:var(--muted);line-height:1.45}
.login-privacy{margin-top:14px;padding:13px;border-radius:18px;background:#eefaf6;border:1px solid #d4ede5;color:#315f56;font-size:12px;line-height:1.7}
.toggle{width:48px;height:28px;border-radius:999px;background:#d7cec7;position:relative;flex-shrink:0}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.12);transition:left .2s ease}
.toggle.on{background:#7bc9b7}
.toggle.on:after{left:23px}
.status-pill{padding:7px 10px;border-radius:999px;background:#eefaf6;border:1px solid #d4ede5;color:#3f8273;font-size:11px;font-weight:900;white-space:nowrap}
.status-pill.muted{background:#f7f3ef;border-color:#e4d8cf;color:#7b6b63}
.tb{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(393px,100%);padding:8px 8px calc(8px + var(--bottom));display:flex;justify-content:space-between;background:rgba(253,248,242,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(234,223,212,.9);z-index:30}
body.home-screen .tb{background:rgba(250,253,249,.9);border-top:1px solid rgba(210,226,218,.9);box-shadow:0 -10px 24px rgba(91,124,115,.12);backdrop-filter:blur(18px)}
.tab-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#94857b;font-size:10px;font-weight:600;padding:5px 0 4px;border-radius:18px;transition:color .24s ease,transform .24s cubic-bezier(.16,1,.3,1)}
.tab-item:before{content:"";position:absolute;top:4px;width:36px;height:28px;border-radius:999px;background:#fff0e7;opacity:0;transform:translateY(6px) scale(.72);transition:opacity .24s ease,transform .28s cubic-bezier(.16,1,.3,1)}
.tab-item svg{position:relative;z-index:1;width:23px;height:23px;fill:#94857b;transition:fill .24s ease,transform .24s cubic-bezier(.16,1,.3,1)}
.tab-item span{position:relative;z-index:1}
body.home-screen .tab-item{color:#82958e}
body.home-screen .tab-item:before{background:rgba(116,183,168,.14)}
body.home-screen .tab-item svg{fill:#82958e}
.tab-item.on{color:#4f9686;transform:translateY(-2px)}
.tab-item.on:before{opacity:1;transform:translateY(0) scale(1)}
.tab-item.on svg{fill:#4f9686;transform:translateY(-1px)}
body.home-screen .tab-item.on{color:#4f9686}
body.home-screen .tab-item.on svg{fill:#4f9686}
#app[data-dir="forward"] .tab-item.on svg,#app[data-dir="back"] .tab-item.on svg{animation:tabPop .34s cubic-bezier(.16,1,.3,1)}
.tab-center{position:relative;top:-14px}
.tab-center-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#72b8a8,#a6c98f);box-shadow:0 10px 22px rgba(91,157,142,.24);transition:transform .24s cubic-bezier(.16,1,.3,1),box-shadow .24s ease}
.tab-center-btn:active{transform:scale(.94);box-shadow:0 6px 14px rgba(91,157,142,.2)}
.tab-center-btn svg{width:26px;height:26px;fill:#fff}
.modal,.sheet,.full{position:fixed;inset:0;z-index:60}
.modal{background:rgba(31,26,23,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{display:flex;align-items:flex-end;justify-content:center;background:rgba(31,26,23,.32)}
.panel{width:min(430px,100%);max-height:88vh;overflow-y:auto;background:#fffdf9;border-radius:28px 28px 0 0;padding:14px 16px calc(22px + var(--bottom));box-shadow:0 -10px 36px rgba(56,40,28,.18)}
.handle{width:40px;height:5px;border-radius:999px;background:#d6cbc1;margin:0 auto 14px}
.sheet{display:block;background:linear-gradient(180deg,#fffaf5,var(--bg));overflow:hidden}
.sheet .panel{width:min(430px,100%);height:100vh;height:100dvh;max-height:none;margin:0 auto;border-radius:0;padding:0 16px calc(24px + var(--bottom));box-shadow:none;overflow-y:auto;overscroll-behavior:contain}
.sheet .handle{display:none}
.checkin-head{position:sticky;top:0;z-index:3;margin:0 -16px 18px;padding:calc(10px + var(--top)) 16px 12px;background:rgba(255,250,245,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(234,223,212,.75);display:flex;align-items:center;justify-content:space-between;gap:12px}
.checkin-head-main{min-width:0}
.checkin-head-title{font-size:18px;font-weight:850;color:#253f39}
.checkin-head-sub{margin-top:4px;font-size:12px;color:var(--muted)}
.checkin-close{height:34px;padding:0 13px;border-radius:999px;background:rgba(32,26,23,.06);color:#4d4038;font-size:13px;font-weight:800;flex-shrink:0}
.checkin-step-badge{padding:7px 10px;border-radius:999px;background:#eefaf6;border:1px solid #d4ede5;color:#3f8273;font-size:11px;font-weight:900;white-space:nowrap;flex-shrink:0}
.sheet .saved-state{min-height:auto;padding:18px 16px 10px}
.full-page{width:min(430px,100%);height:100%;margin:0 auto;background:var(--bg);overflow-y:auto;animation:slideUp .24s ease}
.overlay-page{width:min(430px,100%);height:100%;margin:0 auto;background:linear-gradient(180deg,#fffaf5,var(--bg));overflow-y:auto;animation:slideUp .24s ease}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.emotion-card{padding:14px 8px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.emotion-card.active{border-color:#ffb996;background:#fff6f0}
.emotion-emoji{font-size:30px}
.emotion-label{font-size:12px;color:var(--muted)}
.field{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px;line-height:1.7;color:var(--text)}
.field:focus{outline:none;border-color:#ffbf9e;box-shadow:0 0 0 4px rgba(255,191,158,.15)}
.compact-field{padding:11px 12px;border-radius:14px}
.real-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.real-input-grid .wide{grid-column:1/-1}
.real-input-label{font-size:11px;font-weight:800;color:#8b6b5b;margin-bottom:6px}
.range-field{width:100%;accent-color:#70b8a8}
.range-value{margin-top:5px;font-size:12px;color:var(--muted)}
.sheet-title{text-align:center;font-size:22px;line-height:1.35;font-weight:800}
.sheet-desc{text-align:center;font-size:13px;line-height:1.7;color:var(--muted);margin-top:8px}
.split{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--bottom));transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#2c2622;color:#fff;font-size:12px;line-height:1;z-index:80;white-space:nowrap;box-shadow:0 8px 22px rgba(31,26,23,.18);max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.toast.out{opacity:0;transform:translateX(-50%) translateY(8px);transition:opacity .18s ease,transform .18s ease}
.splash{position:fixed;inset:0;z-index:120;background:
radial-gradient(circle at 20% 12%,rgba(255,229,188,.58),transparent 26%),
radial-gradient(circle at 78% 80%,rgba(139,205,188,.42),transparent 30%),
linear-gradient(160deg,#f8fbf7 0%,#edf6f2 52%,#e5eef3 100%);
display:flex;align-items:center;justify-content:center;transition:opacity .55s ease,transform .55s ease;overflow:hidden}
.splash:before{content:"";position:absolute;inset:0;background:
linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
background-size:38px 38px;mask-image:radial-gradient(circle,black 0%,transparent 72%);animation:splashGrid 5s linear infinite}
.splash.out{opacity:0;transform:scale(1.04)}
.splash-box{position:relative;text-align:center;color:#27413b;width:min(320px,86vw)}
.splash-radar{width:156px;height:156px;border-radius:50%;margin:0 auto;position:relative;border:1px solid rgba(99,145,134,.22);box-shadow:0 0 0 28px rgba(255,255,255,.38),0 0 42px rgba(123,201,183,.24)}
.splash-radar:before{content:"";position:absolute;inset:25px;border-radius:50%;border:1px solid rgba(99,145,134,.18)}
.splash-radar:after{content:"";position:absolute;left:50%;top:50%;width:72px;height:2px;transform-origin:left center;background:linear-gradient(90deg,#7bc9b7,transparent);animation:radarSweep 2.2s linear infinite}
.splash-mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;animation:floatY 3s ease-in-out infinite}
.splash-title{margin-top:34px;font-size:30px;font-weight:900;letter-spacing:1px}
.splash-sub{margin-top:8px;font-size:14px;opacity:.86}
.splash-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.splash-chip{padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.62);border:1px solid rgba(117,151,141,.18);font-size:11px;font-weight:800;color:#5c7e75}
.splash-line{width:168px;height:5px;border-radius:999px;background:rgba(111,155,145,.18);margin:28px auto 0;overflow:hidden}
.splash-fill{height:100%;background:linear-gradient(90deg,#72b8a8,#d8d79c,#8bcdbc);border-radius:999px;animation:loadLine .6s ease forwards}
.agent-shell{padding:16px}
.agent-kicker{font-size:12px;color:#b86a52;font-weight:700}
.agent-heading{margin-top:8px;font-size:24px;line-height:1.35;font-weight:800}
.agent-note{margin-top:8px;font-size:13px;line-height:1.7;color:var(--muted)}
.agent-block{margin-top:18px;padding:16px;border-radius:22px;background:#fff;border:1px solid var(--line)}
.agent-question{font-size:15px;font-weight:700;line-height:1.6}
.agent-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.agent-option{padding:10px 14px;border-radius:999px;background:#fffaf6;border:1px solid var(--line);font-size:13px;font-weight:600}
.agent-option.active{background:#201a17;color:#fff;border-color:#201a17}
.agent-result-title{font-size:14px;font-weight:700;color:#b86a52}
.agent-result-text{margin-top:10px;font-size:14px;line-height:1.8}
.agent-result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

linear-gradient(180deg,#1f2740 0%,#25365a 48%,#1b2038 100%)}

@keyframes loadLine{0%{width:0}100%{width:100%}}

function rememberDialogFocus(){

  var target=dialogFocusReturn?document.getElementById(dialogFocusReturn):null;

}

  return Array.prototype.slice.call(root.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(function(el){return el.offsetParent!==null;});

function activateDialog(dialog,label,onClose){
  rememberDialogFocus();
  dialog.setAttribute("role","dialog");
  dialog.setAttribute("aria-modal","true");
  dialog.setAttribute("aria-label",label);
  dialog.addEventListener("keydown",function(event){
    if(event.key==="Escape"){
      event.preventDefault();
      onClose();
      return;
    }
    if(event.key!=="Tab")return;
    var focusable=dialogFocusable(dialog);
    if(!focusable.length){event.preventDefault();return;}
    var first=focusable[0],last=focusable[focusable.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  });
  dialog.addEventListener("click",function(event){if(event.target===dialog)onClose();});
  setTimeout(function(){var first=dialogFocusable(dialog)[0];if(first)first.focus();},0);
}
function closeDialog(dialog,afterClose){
  if(dialog&&dialog.parentNode)dialog.remove();
  if(typeof afterClose==="function")afterClose();

function normalizeRecord(record,index){

    created=new Date(now);

    created.setHours(20,Math.min(50,index*7),0,0);

  var mood=record.mood||record.et||"calm";
  var score=Number(record.moodScore||record.ii||({happy:5,calm:4,anxious:3,sad:2,tired:2,angry:2}[mood]||3));
  var sleep=Number(record.sleepHours!=null?record.sleepHours:record.sleep);
  var steps=Number(record.steps!=null?record.steps:record.step);
  var social=Number(record.socialScore!=null?record.socialScore:record.sc);
  record.createdAt=created.toISOString();
  record.dateKey=record.dateKey||dateKey(created);
  record.time=record.time||timeLabel(created);
  record.dl=WEEK_LABELS[created.getDay()];
  record.ds=gs(created);
  record.date=record.date||record.ds;
  record.et=mood;

  record.moodScore=record.ii;
  record.sleep=Number.isFinite(sleep)?sleep:6;

  record.step=Number.isFinite(steps)?steps:4200;

  record.socialScore=record.sc;

}
function avg(list,selector,fallback){

function personalBaseline(){
  if(rules().calculatePersonalBaseline){
    var normalized=S.recs.map(function(r){
      return {
        mood:r.mood||r.et,
        sleepHours:r.sleepHours!=null?r.sleepHours:r.sleep,
        steps:r.steps!=null?r.steps:r.step,
        socialScore:r.socialScore!=null?r.socialScore:r.sc,
        moodScore:r.moodScore,
        ii:r.ii
      };
    });
    var shared=rules().calculatePersonalBaseline(normalized);
    if(shared&&shared.base&&shared.delta){
      if(!shared.title){
        shared.title=shared.level==="接近基线"?"今天接近自己的正常节奏":(shared.level==="轻度偏离"?"今天有一个信号偏离基线":"今天多个信号偏离个人基线");
      }
      if(!shared.desc){
        shared.desc=shared.flags&&shared.flags.length?shared.flags.join("；")+"。这是按个人历史节奏判断，不是和别人比较。":"睡眠、活动和连接感没有明显低于你的近几天基线。";
      }
      return shared;
    }
  }
  var latest=getLast();
  var history=S.recs.slice(0,-1).slice(-6);
  if(!history.length)history=S.recs.slice(0,-1);
  var base={
    days:history.length,
    mood:avg(history,moodLevelOf,moodLevelOf(latest)),
    sleep:avg(history,function(r){return Number(r.sleep||r.sleepHours||0);},latest.sleep),
    steps:avg(history,function(r){return Number(r.step||r.steps||0);},latest.step),
    social:avg(history,function(r){return Number(r.sc||r.socialScore||0);},latest.sc)
  };
  function pct(now,normal){
    if(!normal)return 0;
    return Math.round((now-normal)/normal*100);
  }
  var delta={
    mood:+(moodLevelOf(latest)-base.mood).toFixed(1),
    sleepPct:pct(latest.sleep,base.sleep),
    stepsPct:pct(latest.step,base.steps),
    social:+(latest.sc-base.social).toFixed(0)
  };
  var flags=[];
  if(delta.sleepPct<=-25)flags.push("睡眠低于个人基线 "+Math.abs(delta.sleepPct)+"%");
  if(delta.stepsPct<=-40)flags.push("活动低于个人基线 "+Math.abs(delta.stepsPct)+"%");
  if(delta.social<=-20)flags.push("连接感低于个人基线 "+Math.abs(delta.social)+" 点");
  if(delta.mood<=-1)flags.push("情绪低于个人基线 "+Math.abs(delta.mood).toFixed(1)+" 级");
  var level=flags.length>=2?"明显偏离":(flags.length===1?"轻度偏离":"接近基线");
  return {
    base:base,
    delta:delta,
    flags:flags,
    level:level,
    title:level==="接近基线"?"今天接近自己的正常节奏":(level==="轻度偏离"?"今天有一个信号偏离基线":"今天多个信号偏离个人基线"),
    desc:flags.length?flags.join("；")+"。这是按个人历史节奏判断，不是和别人比较。":"睡眠、活动和连接感没有明显低于你的近几天基线。"
  };
}

function personalizeChain(chain,reasons){
  var ids=uniqueChain(chain);
  var sharedRules=rules();
  var status=sharedRules.personalizationStatus?sharedRules.personalizationStatus(S.interventionStats):null;
  if(status&&!status.formed){
    return {chain:ids,reasons:uniqueChain((reasons||[]).concat(["个人倾向仍在建立（"+status.safeFeedbackCount+" / "+status.required+"）"]))};
  }
  if(sharedRules.personalizeRecommendation){
    ids=sharedRules.personalizeRecommendation(ids,S.interventionStats);
  }
  var scored=ids.map(function(id,idx){
    var stat=S.interventionStats&&S.interventionStats[id];
    var avgDelta=interventionAverageDelta(id);
    var boost=stat?Math.min(2.4,(stat.count||0)*.35)+Math.max(0,avgDelta)/8:0;
    return {id:id,idx:idx,score:idx-boost,avgDelta:avgDelta,count:stat?stat.count:0};
  }).sort(function(a,b){return a.score-b.score;});
  var next=scored.map(function(item){return item.id;});
  var best=scored.find(function(item){return item.count>0&&item.avgDelta>=4;});
  var outReasons=(reasons||[]).slice();
  if(best){
    var label=(INTV.find(function(x){return x.id===best.id;})||{title:best.id}).title;
    outReasons.push("你过去完成「"+label+"」后平均提升 "+best.avgDelta+" 分");
  }
  return {chain:next,reasons:uniqueChain(outReasons)};
}

function currentPlan(){
  var last=getLast();
  var base=PATHS[last.et]||PATHS.calm;
  var risk=riskAssessment();
  var recommended=rules().recommendPath(last,risk);
  var chain=recommended.path.slice();
  var reasons=recommended.reasons&&recommended.reasons.length?recommended.reasons.slice():[];
  var label=base.label;
  var desc=base.desc;
  if(risk.level==="高风险"){
    return {
      label:"先联系一个可信任的人",
      intro:"现在先不安排普通练习，优先把求助这一步发出去。",
      chain:["help"],
      desc:"先让一个可信任的人知道当前状态，必要时直接联系热线、老师或当地紧急救助。",
      reasons:["出现危机信号"],
      base:base
    };
  }
  if(last.connectionNeed==="need"||last.sc<25){
    label="先让一个人知道你";
    desc="今天的关键不是独自消化，而是先保留一个能接住你的出口。";
  }else if(last.connectionNeed==="avoid"){
    desc="先从可独立完成的动作开始，再保留一个连接出口。";
  }
  if(last.sleep<5.2){
    label="先把身体和睡眠收住";
    desc="睡眠太低时不适合硬推效率，先让身体慢慢降下来。";
  }else if(last.sleep<6){
    desc="睡眠偏低时，先降低生理唤醒，再安排轻量行动。";
  }
  if(last.energyLevel==="low"){
    if(label!=="先让一个人知道你"&&last.sleep>=5.2)label="先从最省力的一步开始";
  }else if(last.energyLevel==="high"&&["happy","calm"].indexOf(last.et)>=0){
    label="顺着状态做一件小事";
  }
  if(recentNegativeCount()>=3)reasons.push("最近负面状态连续出现");
  var baseline=personalBaseline();
  if(baseline.flags.length)reasons.push(baseline.flags[0]);
  if(!reasons.length)reasons.push("当前状态较平稳");
  var personalized=personalizeChain(chain,reasons);
  chain=personalized.chain;
  reasons=personalized.reasons;
  return {
    label:label,
    intro:base.intro,
    chain:uniqueChain(chain).slice(0,3),
    desc:desc,
    reasons:uniqueChain(reasons),
    base:base
  };
}

function surveySeverity(survey,score){
  if(survey.id==="phq"){
    if(score>=20)return {level:"分数很高",tone:"high",advice:"这份自查只提示负担偏重，建议尽快联系校心理中心、辅导员或专业支持资源。"};

    if(score>=10)return {level:"分数中等偏高",tone:"mid",advice:"建议安排一次正式支持，同时继续记录睡眠和情绪变化。"};
    if(score>=5)return {level:"分数有波动",tone:"low",advice:"可以先从睡眠、连接和低负担行动开始观察。"};
    return {level:"很少",tone:"stable",advice:"当前自查分数较低，继续保持记录就好。"};
  }
  if(survey.id==="gad"){
    if(score>=15)return {level:"分数很高",tone:"high",advice:"担忧负担较重，建议尽快联系专业支持或校内心理资源。"};
    if(score>=10)return {level:"分数中等偏高",tone:"mid",advice:"担忧已经比较影响状态，建议把压力源拆小，并考虑找人聊聊。"};
    if(score>=5)return {level:"分数有波动",tone:"low",advice:"先用呼吸、散步和记录降低身体紧张，再看担忧是否回落。"};
    return {level:"很少",tone:"stable",advice:"当前焦虑自查分数较低，继续观察即可。"};
  }
  if(score>=27)return {level:"高压力",tone:"high",advice:"压力感偏高，建议先减少任务体量，并让一个可信任的人知道。"};
  if(score>=14)return {level:"中等压力",tone:"mid",advice:"压力正在消耗你，可以把待办拆成更小的可完成动作。"};
  return {level:"低压力",tone:"stable",advice:"当前压力感较低，继续保留恢复性活动和睡眠节奏。"};
}
function analyzeSurvey(){

  survey.questions.forEach(function(_,idx){

    total+=survey.reverse&&survey.reverse.indexOf(idx)>=0?3-raw:raw;
  });
  var severity=surveySeverity(survey,total);
  var risk=riskAssessment();
  var path=currentPlan();
  var flags=[];
  if(severity.tone==="high")flags.push("自查分数偏高");
  if(risk.level==="高风险")flags.push("Safety Gate 已触发");
  if(lowSleepDays()>=3)flags.push("近期低睡眠连续出现");
  if(!flags.length)flags.push("当前可先做轻量观察");
  return {
    id:"survey_"+Date.now(),
    surveyId:survey.id,
    title:survey.title,
    score:total,
    range:survey.range,
    level:severity.level,
    tone:severity.tone,
    advice:severity.advice,

function markInterventionComplete(id,title){

  var beforePath=currentPlan();
  var beforeMax=Math.max(0,beforePath.chain.length-1);
  var beforeIndex=Math.max(0,Math.min(S.companionIndex,beforeMax));
  var completedCurrent=beforePath.chain[beforeIndex]===id;
  var map={breathe:"先把身体降下来",focus:"只做一件小事",walk:"离开原地 10 分钟",journal:"把脑子里的话倒出来",sleep:"今晚先收住",friend:"让一个人知道你"};

    S.completed.push({id:id,title:label,time:new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})});
  }
  if(id==="breathe"){last.text="刚刚做完呼吸，身体先慢下来了一点。";last.ii=Math.min(5,last.ii+1);}
  if(id==="focus"){last.text="完成了一段专注，掌控感回来了些。";last.ii=Math.min(5,last.ii+1);}

  if(id==="friend"){last.sc=Math.min(100,last.sc+10);last.text="给朋友发了消息，至少让一个人知道了自己。";}
  last.sleepHours=last.sleep;

  last.socialScore=last.sc;
  last.note=last.text;
  last.riskLevel=riskAssessment().level;
  last.completedInterventions=last.completedInterventions||[];
  if(last.completedInterventions.indexOf(id)<0)last.completedInterventions.push(id);
  var afterScore=pulseScore();
  var feedback={actionId:id,delta:afterScore-beforeScore,riskMode:decisionTrace.mode,riskLevel:riskAssessment().level,completedAt:new Date().toISOString()};
  if(rules().recordSafeFeedback)S.interventionStats=rules().recordSafeFeedback(S.interventionStats,feedback);
  else{

  }

    S.companionIndex=beforeIndex<beforeMax?beforeIndex+1:0;
  }
  persistState();
  refreshCompanionStepCard();
  toast(label+"已写回首页和趋势");
}

function buildNoiseBuffer(ctx,seconds){
  var length=ctx.sampleRate*seconds;
  var buffer=ctx.createBuffer(1,length,ctx.sampleRate);
  var data=buffer.getChannelData(0);
  for(var i=0;i<length;i++)data[i]=Math.random()*2-1;
  return buffer;
}
function stopSleepAudio(){
  sleepAudio.nodes.forEach(function(node){
    try{
      if(node.stop)node.stop();
      if(node.disconnect)node.disconnect();
    }catch(e){}
  });
  if(sleepAudio.gain){
    try{sleepAudio.gain.disconnect();}catch(e){}
  }
  sleepAudio.nodes=[];
  sleepAudio.gain=null;
  sleepAudio.mode=null;
}
function startSleepAudio(mode){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){toast("当前浏览器不支持声音生成");return false;}
  stopSleepAudio();
  var ctx=sleepAudio.ctx||new AC();
  sleepAudio.ctx=ctx;
  if(ctx.state==="suspended")ctx.resume();
  var master=ctx.createGain();
  master.gain.value=S.intvState.sleep.muted?0:(0.075*S.intvState.sleep.volume);
  master.connect(ctx.destination);
  sleepAudio.gain=master;
  var noise=ctx.createBufferSource();
  noise.buffer=buildNoiseBuffer(ctx,2);
  noise.loop=true;
  var filter=ctx.createBiquadFilter();
  var lfo=ctx.createOscillator();
  var lfoGain=ctx.createGain();
  lfo.type="sine";
  if(mode==="rain"){
    filter.type="highpass";
    filter.frequency.value=850;
    lfo.frequency.value=7;
    lfoGain.gain.value=80;
  }else if(mode==="forest"){
    filter.type="bandpass";
    filter.frequency.value=520;
    filter.Q.value=0.7;
    lfo.frequency.value=0.18;
    lfoGain.gain.value=120;
    var bird=ctx.createOscillator();
    var birdGain=ctx.createGain();
    bird.type="sine";
    bird.frequency.value=880;
    birdGain.gain.value=0.006;
    bird.connect(birdGain);
    birdGain.connect(master);
    bird.start();
    sleepAudio.nodes.push(bird,birdGain);
  }else{
    filter.type="lowpass";
    filter.frequency.value=680;
    filter.Q.value=0.35;
    lfo.frequency.value=0.08;
    lfoGain.gain.value=160;
  }
  lfo.connect(lfoGain);
  lfoGain.connect(filter.frequency);
  noise.connect(filter);
  filter.connect(master);
  noise.start();
  lfo.start();
  sleepAudio.nodes.push(noise,filter,lfo,lfoGain);
  sleepAudio.mode=mode;
  return true;
}

function formatLocalStamp(value){
  var date=new Date(value);
  if(!Number.isFinite(date.getTime()))return "刚刚";
  return (date.getMonth()+1)+"月"+date.getDate()+"日 "+String(date.getHours()).padStart(2,"0")+":"+String(date.getMinutes()).padStart(2,"0");
}
function upsertMemoState(memo){
  var index=S.memos.findIndex(function(item){return item.id===memo.id;});
  if(index>=0)S.memos[index]=memo;

}

function runRuleCases(){
  return RULE_CASES.map(function(item){
    var records=item.records||[item.input];
    var latest=records[records.length-1];
    var risk=rules().assessRisk(records);
    var recommendation=rules().recommendPath(latest,risk);
    var score=rules().calculateRecoveryScore(latest,latest.completedInterventions||[]);
    var riskOk=risk.level===item.risk;
    var pathOk=JSON.stringify(recommendation.path)===JSON.stringify(item.path);
    return {
      id:item.id,

function bindAgentEvents(){
  var accept=document.getElementById("agentAcceptPlan");
  if(accept)accept.onclick=function(){
    var path=currentPlan();
    closeAgent();
    if(riskAssessment().level==="高风险"){switchTab("help");return;}

  };

      S.agentStep=3;
      refreshAgent();
    };
  });
  document.querySelectorAll("[data-agent-value]").forEach(function(btn){
    btn.onclick=function(){
      var val=btn.dataset.agentValue;
      if(S.agent==="help"){
        S.agentFlow="compose";
        if(S.agentStep===0){
          S.agentQ1=val;
          S.agentStep=1;
        }else if(S.agentStep===1){
          S.agentQ2=val;
          S.agentStep=2;
        }else{
          S.agentStep=3;
        }
        refreshAgent();
        return;
      }
      if(S.agent==="home"){
        if(S.agentStep===1){
          S.agentQ1=val;
          S.agentStep=2;
        }else if(S.agentStep===2){
          S.agentQ2=val;
          S.agentStep=3;
        }else{
          S.agentQ1=val;
          S.agentStep++;
        }
        refreshAgent();
        return;
      }
      if(S.agent==="companion"){
        S.agentQ1=val;
        S.agentStep=1;
        refreshAgent();
        return;
      }
      if(S.agentStep===1)S.agentQ1=val;
      else if(S.agentStep===2)S.agentQ2=val;
      else if(S.agentStep===0)S.agentQ1=val;
      S.agentStep++;
      refreshAgent();
    };
  });
  var finish=document.getElementById("agentFinish");

function breatheElapsed(st,phase){
  if(!st.running)return 0;
  return Math.max(0,Math.min(phase.d,phase.d-st.count));
}
function breatheRingBackground(st){
  var stops=[];
  var cursor=0;
  var gapColor="rgba(255,255,255,.78)";
  BREATHE_PHASES.forEach(function(phase,idx){
    var span=phase.d/BREATHE_TOTAL*360;
    var start=cursor;
    var end=cursor+span;
    var gap=Math.min(3,span*.18);
    var segStart=start+gap/2;
    var segEnd=end-gap/2;
    var fill=segStart;
    if(st.running){
      if(idx<st.phaseIndex){
        fill=segEnd;
      }else if(idx===st.phaseIndex){
        fill=segStart+(breatheElapsed(st,phase)/phase.d)*(segEnd-segStart);
      }
    }
    stops.push(gapColor+" "+start.toFixed(2)+"deg "+segStart.toFixed(2)+"deg");
    if(fill>segStart)stops.push(phase.color+" "+segStart.toFixed(2)+"deg "+fill.toFixed(2)+"deg");
    if(fill<segEnd)stops.push(phase.muted+" "+fill.toFixed(2)+"deg "+segEnd.toFixed(2)+"deg");
    stops.push(gapColor+" "+segEnd.toFixed(2)+"deg "+end.toFixed(2)+"deg");
    cursor=end;
  });
  return "conic-gradient(from -90deg,"+stops.join(",")+")";
}
function renderBreatheLegend(activeIndex){
  return '<div class="breathe-legend">'+BREATHE_PHASES.map(function(phase,idx){
    var state=idx===activeIndex?"active":"pending";
    return '<div class="breathe-phase" data-breathe-phase="'+idx+'" data-state="'+state+'" style="--phase-color:'+phase.color+';--phase-soft:'+phase.soft+'"><span>'+phase.n+'</span><strong>'+phase.d+' 秒</strong></div>';
  }).join("")+'</div>';
}
function updateBreathePhaseCards(st){
  document.querySelectorAll("[data-breathe-phase]").forEach(function(el){
    var idx=Number(el.dataset.breathePhase);
    var state="pending";
    if(st.running&&idx<st.phaseIndex)state="done";
    if(idx===st.phaseIndex)state="active";
    el.dataset.state=state;
  });
}

function toggleBreatheSession(){
  var st=S.intvState.breathe;
  if(st.running){
    clearInterval(st.timer);
    st.timer=null;
    st.running=false;
    st.phaseIndex=0;
    st.count=BREATHE_PHASES[0].d;
    if(st.cycles>0)markInterventionComplete("breathe","先把身体降下来");
    updateBreatheView();
    return;
  }
  st.running=true;
  st.phaseIndex=0;
  st.count=BREATHE_PHASES[0].d;
  updateBreatheView();
  st.timer=setInterval(function(){
    st.count--;
    if(st.count<=0){
      st.phaseIndex++;
      if(st.phaseIndex>=BREATHE_PHASES.length){
        st.phaseIndex=0;
        st.cycles++;
      }
      st.count=BREATHE_PHASES[st.phaseIndex].d;
    }
    updateBreatheView();
  },1000);
}

function renderBreathePage(){
  var st=S.intvState.breathe;
  var copyMap={
    "吸气":"慢慢吸进去，先别想别的。",
    "停住":"停一下，让身体先知道你正在慢下来。",
    "吐气":"把那口紧绷慢慢吐出去。"
  };

function renderSleepPage(){
  var st=S.intvState.sleep;
  var quotes={
    wind:"今晚先把自己放回身体里，别继续被今天拽着走。",
    rain:"雨声不用帮你解决问题，它只负责让你慢慢松一点。",
    forest:"像走进一片安静的树林里，先把身体安放好。"
  };
  var labels={wind:"呼吸",rain:"雨声",forest:"森林"};
  var body='<div class="sleep-scene"><div class="sleep-moon">'+iconSVG("moon")+'</div><div class="timer-title" style="text-align:center;margin-top:18px">今晚先收一收。</div><div class="sleep-quote">'+quotes[st.mode]+'</div><div class="sleep-modes">'+["wind","rain","forest"].map(function(mode){return '<button class="sleep-mode'+(st.mode===mode?' active':'')+'" data-sleep-mode="'+mode+'">'+iconSVG(mode)+'<span>'+labels[mode]+'</span></button>';}).join("")+'</div><div class="sleep-audio-state" id="sleepAudioState">'+(st.running?(labels[st.mode]+"播放中"):'点开始后播放声音')+'</div><div class="sleep-audio-controls"><button class="sleep-mute" id="sleepMute">'+(st.muted?'取消静音':'静音')+'</button><input class="sleep-volume" id="sleepVolume" type="range" min="0" max="100" value="'+Math.round(st.volume*100)+'" aria-label="音量"></div><div class="timer-stats" style="margin-top:30px"><div class="timer-stat"><div class="timer-stat-value" id="sleepTime">'+String(Math.floor(st.remaining/60)).padStart(2,"0")+':'+String(st.remaining%60).padStart(2,"0")+'</div><div class="timer-stat-label" id="sleepState">'+(st.running?'剩余时间':'准备开始')+'</div></div><div class="timer-stat"><div class="timer-stat-value">5 分钟</div><div class="timer-stat-label">放松时长</div></div></div><div class="stage-actions" style="max-width:280px;margin:26px auto 0"><button class="btn-lite" id="sleepToggle">'+(st.running?'暂停':'开始放松')+'</button><button class="btn-lite" id="sleepReset">重置</button></div></div>';
  renderFullPage("今晚先收住",body);
  document.querySelectorAll("[data-sleep-mode]").forEach(function(el){
    el.onclick=function(){st.mode=el.dataset.sleepMode;switchSleepAudio(st.mode);refreshIntervention();};
  });
  document.getElementById("sleepVolume").oninput=function(){setSleepVolume(this.value/100);};
  document.getElementById("sleepMute").onclick=function(){toggleSleepMute();};
  document.getElementById("sleepToggle").onclick=function(){
    if(st.running){
      clearInterval(st.timer);
      st.timer=null;
      st.running=false;
      stopSleepAudio();
      updateSleepView();
      return;
    }
    if(st.remaining<=0)st.remaining=st.total;
    if(!startSleepAudio(st.mode))return;
    st.running=true;
    updateSleepView();
    st.timer=setInterval(function(){
      st.remaining--;
      if(st.remaining<=0){
        clearInterval(st.timer);
        st.timer=null;
        st.running=false;
        st.remaining=0;
        stopSleepAudio();
        markInterventionComplete("sleep","今晚先收住");
      }
      updateSleepView();
    },1000);

  document.getElementById("sleepReset").onclick=function(){
    if(st.timer)clearInterval(st.timer);
    st.timer=null;
    st.running=false;
    st.remaining=st.total;
    stopSleepAudio();
    updateSleepView();
  };
